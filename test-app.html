<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试应用</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 32px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.8;
      font-size: 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 30px 0;
    }
    .stat-box {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 20px;
      border: 2px solid #667eea;
    }
    .stat-label {
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .stat-value {
      color: #667eea;
      font-size: 28px;
      font-weight: bold;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .button-group {
      margin-top: 30px;
    }
    .reset-btn {
      background: #999;
      font-size: 14px;
      padding: 10px 20px;
    }
    .reset-btn:hover {
      background: #777;
    }
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 欢迎！</h1>
    <p>这是通过应用托管平台发布的测试应用</p>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">点击次数</div>
        <div class="stat-value" id="clickCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">访问次数</div>
        <div class="stat-value" id="visitCount">1</div>
      </div>
    </div>

    <div class="button-group">
      <button onclick="incrementClick()">👆 点击我</button>
      <button onclick="doubleClick()">⚡ 双倍点击</button>
      <button class="reset-btn" onclick="resetCount()">重置</button>
    </div>

    <div class="footer">
      <p>✨ 点击后的数据存储在本地浏览器中</p>
    </div>
  </div>

  <script>
    // 从 localStorage 读取数据
    function loadData() {
      const clicks = localStorage.getItem('testAppClicks') || '0';
      document.getElementById('clickCount').textContent = clicks;
    }

    function incrementClick() {
      let count = parseInt(localStorage.getItem('testAppClicks') || '0');
      count++;
      localStorage.setItem('testAppClicks', count);
      document.getElementById('clickCount').textContent = count;
    }

    function doubleClick() {
      let count = parseInt(localStorage.getItem('testAppClicks') || '0');
      count += 2;
      localStorage.setItem('testAppClicks', count);
      document.getElementById('clickCount').textContent = count;
    }

    function resetCount() {
      localStorage.removeItem('testAppClicks');
      document.getElementById('clickCount').textContent = '0';
    }

    // 页面加载时读取数据
    loadData();
  </script>
</body>
</html>
